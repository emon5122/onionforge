name: release-please

# Maintains a release PR from Conventional Commits on main. Merging it creates
# the vX.Y.Z tag and GitHub release; the tag push triggers release.yml.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A PAT is required: tags created with the default GITHUB_TOKEN do
          # not trigger other workflows, so release.yml would never run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
