# onionforge.yml — the single source of truth for OnionForge.
#
# Each entry under `services` publishes one persistent Tor v3 onion address
# and proxies it to one HTTP(S) upstream. The service NAME identifies the
# onion identity: keep the name and the address stays the same, even if you
# change the target.

services:

  # Docker service on the same network. The backend needs no published ports.
  web:
    prefix: web                       # optional vanity prefix (a-z, 2-7), or a list: [web, www]
    target: http://frontend:3000

  api:
    prefix: api
    target: http://backend:8000

  # No prefix: a random v3 address.
  admin:
    target: http://admin:8080

  # External HTTPS upstream (certificate verification stays on).
  # company:
  #   prefix: company
  #   target: https://company.example
  #   rewrite_redirects: true         # rewrite Location headers back to the onion

  # Internal HTTPS with a private CA.
  # internal:
  #   target: https://backend:8443
  #   tls:
  #     ca_file: /etc/onionforge/ca.pem
  #     # server_name: backend.internal
  #     # insecure_skip_verify: true  # last resort; never the default

# security:
#   allow_private_targets: false      # IP literals in 10/8, 172.16/12, 192.168/16, ...
#   allow_loopback_targets: false     # 127.0.0.0/8, ::1, localhost
#   allow_link_local_targets: false   # 169.254.0.0/16 (cloud metadata), fe80::/10

# vanity:
#   background: auto                  # prefixes of 7+ chars are searched in the background
#   threads: 0                        # CPU threads for vanity searches (0 = all)

# logging:
#   access_log: false                 # one log line per request when true
