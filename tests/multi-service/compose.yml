services:
  backend:
    image: jmalloc/echo-server:latest
    expose: ["8080"]
    networks: [internal]
  frontend:
    image: caddy:2.10
    command: ["caddy", "respond", "--listen", ":3000", "--body", "frontend says hi"]
    networks: [internal]
  onionforge:
    image: ${ONIONFORGE_IMAGE}
    volumes:
      - data:/var/lib/tor
      - ${ONIONFORGE_CONFIG_FILE}:/etc/onionforge/onionforge.yml:ro
    networks: [internal]
networks:
  internal:
volumes:
  data:
